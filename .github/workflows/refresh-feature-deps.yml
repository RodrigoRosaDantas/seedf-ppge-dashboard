name: Refresh feature dependencies

on:
  push:
    branches: [feat/seedf-study-os-intelligence-v5]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seedf-study-os-intelligence-v5
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh production security baseline
        run: |
          npm install --save-exact next@16.3.6
          npm install --save-dev --save-exact eslint-config-next@16.3.6
          npm audit fix --omit=dev || true

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes."
          else
            git commit -m "chore: refresh production dependency security"
            git push origin HEAD:feat/seedf-study-os-intelligence-v5
          fi

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high
