name: Sync SEEDF dashboard from Notion

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync sanitized Notion snapshot
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Configure the NOTION_TOKEN Actions secret before running this workflow."
            exit 1
          fi
          node scripts/sync-notion.mjs

      - name: Commit snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/seedf-snapshot.json
          if git diff --cached --quiet; then
            echo "No public snapshot changes detected."
            exit 0
          fi
          git commit -m "chore: sync SEEDF dashboard snapshot"
          git push
