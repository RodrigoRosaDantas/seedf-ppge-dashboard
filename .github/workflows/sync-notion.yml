name: Sync SEEDF dashboard from Notion

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-leis-primeiro.mjs"
      - ".github/workflows/sync-notion.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-notion
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync sanitized Notion snapshots
        env:
          NOTION_TOKEN: ${{ secrets.SEEDF }}
          NOTION_PAGE_ID: ${{ vars.NOTION_PAGE_ID }}
          NOTION_VERSION: "2026-03-11"
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::error::Configure the SEEDF Actions secret before running this workflow."
            exit 1
          fi
          node scripts/sync-notion.mjs
          node scripts/sync-leis-primeiro.mjs

      - name: Commit snapshots when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/seedf-snapshot.json public/data/leis-primeiro.json
          if git diff --cached --quiet; then
            echo "No public snapshot changes detected."
            exit 0
          fi
          git commit -m "chore: sync SEEDF dashboard snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
